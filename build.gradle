plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}
base { archivesName = 'bettermobcombat-neoforge-1.21.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
sourceSets.main {
    java.setSrcDirs(['common/src/main/java', 'neoforge/src/main/java'])
    resources.setSrcDirs(['common/src/main/resources', 'neoforge/src/main/resources'])
}
neoForge {
    version = neoforge_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { bettermobcombat { sourceSet(sourceSets.main) } }
}

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://maven.createmod.net'; content { includeGroup 'net.createmod.ponder'; includeGroup 'dev.engine-room.flywheel' } }
    maven { url = 'https://maven.ithundxr.dev/snapshots'; content { includeGroup 'com.tterrag.registrate' } }
    maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
}

dependencies {
    implementation('maven.modrinth:better-combat:vyOG66rq') { transitive = false }
    implementation('maven.modrinth:playeranimator:YMsfZkrU') { transitive = false }
    implementation('maven.modrinth:cloth-config:15.0.140+neoforge') { transitive = false }
    compileOnly('maven.modrinth:guard-villagers:Ny0tyzZ5') { transitive = false }
}
tasks.withType(ProcessResources).configureEach {
    def props = new Properties()
    rootProject.file('gradle.properties').withInputStream { props.load(it) }
    props.setProperty('description', props.getProperty('description'))
    inputs.properties(props)
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand(props) }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from('LICENSE')
}

neoForge { unitTest { enable(); testedMod = mods.bettermobcombat } }
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'net.neoforged:testframework:21.1.236'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
configurations.testCompileOnly.extendsFrom(configurations.compileOnly)
tasks.withType(Test).configureEach { useJUnitPlatform(); testLogging { events 'failed', 'skipped' } }

dependencies { runtimeOnly('maven.modrinth:guard-villagers:Ny0tyzZ5') { transitive = false } }

tasks.withType(Test).configureEach { timeout = java.time.Duration.ofMinutes(5) }
