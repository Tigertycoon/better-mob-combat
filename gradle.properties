# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to the multiloader-common.gradle expandProps map.

# Project
version=1.3.0-neoforge-port.1
group=me.Thelnfamous1.bettermobcombat
java_version=21

# Common
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
## NeoForm version used by the 'common' subproject (see https://projects.neoforged.net/neoforged/neoform)
neo_form_version=1.21.1-20240808.144430
# Parchment mappings (see https://parchmentmc.org/docs/getting-started)
parchment_minecraft=1.21
parchment_version=2024.11.10

# NeoForge
neoforge_version=21.1.236
neoforge_loader_version_range=[4,)

# Forge (kept for legacy forge subproject)
forge_version=47.2.30
forge_loader_version_range=[47,)
forge_version_range=[47,)

# Fabric
fabric_version=0.109.0+1.21.1
fabric_loader_version=0.16.9

# Mod options
mod_name=Better Mob Combat
mod_author=Thelnfamous1
mod_id=bettermobcombat
license=CC0-1.0
description=An add-on mod to Better Combat that allows it to work with (humanoid) mobs.
credits=Daedelus, KosmX, Gecko, LukeGrahamLandry

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

