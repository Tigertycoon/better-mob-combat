plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    // Use NeoForm to get Minecraft classes without a full NeoForge installation
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    // Mixin support
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // MixinExtras (fabric and neoforge both bundle it, so compileOnly is safe in common)
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras_version}"))

    // BetterCombat API — compileOnly so common can reference it;
    // the actual runtime dep is declared in each loader subproject.
    compileOnly("maven.modrinth:better-combat:${better_combat_version}-neoforge")

    // BetterCombat dependencies
    compileOnly("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    compileOnly("dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}")

    // Guard Villagers (compileOnly for compat mixins)
    compileOnly("maven.modrinth:guard-villagers:${guard_villagers_version}")
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
